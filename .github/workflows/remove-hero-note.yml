name: Remove hero note

on:
  push:
    branches: [main]
    paths: [.hero-note-remove-trigger]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove hero note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/periodisering-oldtiden/index.html')
          s = p.read_text(encoding='utf-8')
          import re
          s2 = re.sub(r'\s*<div class="hero-note"[^>]*>.*?</div>\s*', '\n', s, flags=re.S)
          if s2 == s:
              raise SystemExit('hero-note element not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Clean up and commit
        shell: bash
        run: |
          rm -f .hero-note-remove-trigger .github/workflows/remove-hero-note.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: remove hero training note'
          git push origin main
