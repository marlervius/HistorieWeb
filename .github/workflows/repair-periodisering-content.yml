name: Repair periodisering content

on:
  push:
    branches: [main]
    paths:
      - .repair/FIX

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Repair JavaScript content
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/periodisering-oldtiden/innhold.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("subtitle: 'Test om du kan stoffet,", "subtitle: 'Test om du kan stoffet',")
          s = s.replace("heroNote: ,", "heroNote: '',")
          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check public/periodisering-oldtiden/innhold.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/periodisering-oldtiden/innhold.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair editable periodisering content'
            git push origin main
          fi
