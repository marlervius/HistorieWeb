name: Bootstrap editable periodisering self-test

on:
  push:
    branches:
      - feat/editable-periodisering-selftest
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  build-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/editable-periodisering-selftest
          fetch-depth: 0

      - name: Reconstruct editable site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/periodisering-oldtiden
          cat .bootstrap/index-1.b64 .bootstrap/index-2.b64 | tr -d '\n\r ' | base64 -d | gunzip > public/periodisering-oldtiden/index.html
          cat .bootstrap/content-1.b64 .bootstrap/content-2.b64 | tr -d '\n\r ' | base64 -d | gunzip > public/periodisering-oldtiden/innhold.js
          test -s public/periodisering-oldtiden/index.html
          test -s public/periodisering-oldtiden/innhold.js
          grep -q 'HISTORIE_CONTENT' public/periodisering-oldtiden/innhold.js
          grep -q 'innhold.js' public/periodisering-oldtiden/index.html

      - name: Commit reconstructed files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/periodisering-oldtiden/index.html public/periodisering-oldtiden/innhold.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: add editable periodisering self-test'
            git push origin HEAD:feat/editable-periodisering-selftest
          fi
