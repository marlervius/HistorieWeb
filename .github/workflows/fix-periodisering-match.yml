name: Fix periodisering matching question

on:
  push:
    branches:
      - main
    paths:
      - .fix/FIX_PERIODISERING_MATCH

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch duplicated timeline questions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/periodisering-oldtiden/index.html')
          s = p.read_text(encoding='utf-8')
          old = """    if(id===3) body+=renderTimeline();
    if(id===5) body+=renderGoals();
    else body+=(Q[id]||[]).map((q,i)=>renderQuestion(q,i+1)).join('');"""
          new = """    if(id===3) body+=renderTimeline();
    else if(id===5) body+=renderGoals();
    else body+=(Q[id]||[]).map((q,i)=>renderQuestion(q,i+1)).join('');"""
          if old not in s:
              raise SystemExit('renderSection block not found')
          s = s.replace(old, new, 1)
          s = s.replace('save();updateSectionCompletion(6);', 'save();updateSectionCompletion(5);', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/periodisering-oldtiden/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: register timeline matching answers correctly'
            git push origin main
          fi
