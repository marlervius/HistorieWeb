name: Fix periodisering storage fallback

on:
  push:
    branches: [main]
    paths:
      - .fix/PERIODISERING_STORAGE

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Repair periodisering interaction logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/periodisering-oldtiden/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const x=JSON.parse(localStorage.getItem(STORAGE_KEY));", "const x=JSON.parse(window.localStorage.getItem(STORAGE_KEY));")
          s = s.replace("function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateProgress();renderHomeCards();}", "function save(){try{window.localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}updateProgress();renderHomeCards();}")
          s = s.replace("state.completedSections.sort();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateProgress();renderHomeCards();", "state.completedSections.sort();try{window.localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}updateProgress();renderHomeCards();")
          old = """    if(id===3) body+=renderTimeline();
    if(id===5) body+=renderGoals();
    else body+=(Q[id]||[]).map((q,i)=>renderQuestion(q,i+1)).join('');"""
          new = """    if(id===3) body+=renderTimeline();
    else if(id===5) body+=renderGoals();
    else body+=(Q[id]||[]).map((q,i)=>renderQuestion(q,i+1)).join('');"""
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("save();updateSectionCompletion(6);", "save();updateSectionCompletion(5);", 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate repaired render logic
        shell: python
        run: |
          from pathlib import Path
          s = Path('public/periodisering-oldtiden/index.html').read_text(encoding='utf-8')
          expected = """    if(id===3) body+=renderTimeline();
    else if(id===5) body+=renderGoals();
    else body+=(Q[id]||[]).map((q,i)=>renderQuestion(q,i+1)).join('');"""
          assert expected in s, 'Timeline questions can still be rendered twice'
          assert 'save();updateSectionCompletion(6);' not in s, 'Old section number remains'
          print('OK: timeline questions render once and matching controls can be read as one set')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/periodisering-oldtiden/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: register timeline matching answers correctly'
            git push origin main
          fi
